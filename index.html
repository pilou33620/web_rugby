      if(spot) this.setPos(nk, spot[0], spot[1]);
    }
    const dR = nr ? hdist(nr.c, nr.r, lc, lr) : 99, dK = nk ? hdist(nk.c, nk.r, lc, lr) : 99;
    this.ball = {state:'dead', x:hx(lc, lr), y:hy(lr), z:0};
    const moveOnto = p => { if(this.free(lc, lr)) this.setPos(p, lc, lr); };
    if(dR <= 1 && dK <= 1 && (b.kind === 'box' || b.kind === 'bomb' || b.kind === 'kickoff')){
      const pR = clamp(.5 + (nr.num >= 11 || nr.num === 15 ? .06 : 0) - this.ctx.rain * .05 - (this.ctx.fog ? .05 : 0), .3, .7), u = rnd();
      if(u < pR){ moveOnto(nr); this.giveBall(nr, {fresh:true, hold:1}); this.log(`Duel aérien gagné par le ${this.pn(nr)} !`, 'info', o); this.fx('ooh'); return; }
      if(u < pR + .3){ moveOnto(nk); this.giveBall(nk, {fresh:true, hold:1}); this.log(`Le ${this.pn(nk)} s'envole et récupère le ballon pour ${this.club[t].court} !`, 'turn', t); this.fx('ooh'); this.say(`Superbe duel aérien de ${this.spk(nk)} !`, 0); return; }
      this.log(`Ballon disputé dans les airs, il retombe au sol !`, 'info');
      this.ball = {state:'loose', x:hx(lc, lr), y:hy(lr), z:0, c:lc, r:lr, t:0}; return;
    }
    if(dR <= 1 && (dK > 1 || rnd() < .62)){
      const pc = clamp(.9 - (dK <= 1 ? .18 : 0) + (nr.num >= 11 ? .04 : 0) - this.ctx.rain * .04 - (this.ctx.fog ? .05 : 0), .5, .97);
      if(rnd() < pc){ moveOnto(nr); this.giveBall(nr, {fresh:true, hold:1}); if(rnd() < .5) this.log(`Bonne réception du ${this.pn(nr)}.`, 'info', o); return; }
      this.st[o].knock++;
      this.log(`En-avant à la réception du ${this.pn(nr)}.`, 'info', o);
      this.startScrum(lc, lr, t, 'en-avant'); return;
    }
    if(dK <= 1 && rnd() < (b.kind === 'box' || b.kind === 'bomb' || b.kind === 'kickoff' ? .55 : .4)){
      moveOnto(nk); this.giveBall(nk, {fresh:true, hold:1});
      this.log(`${this.club[t].court} récupère son propre coup de pied !`, 'turn', t); return;
    }
    this.ball = {state:'loose', x:hx(lc, lr), y:hy(lr), z:0, c:lc, r:lr, t:0};
  }
  looseTick(){
    const b = this.ball; b.t++;
    const ov = new Map();
    for(const tm of [0, 1]) [].concat(this.nearestUp(tm, b.c, b.r, 3)).forEach(p => p && ov.set(p, [b.c, b.r]));
    const nn = this.P.filter(p => p.state === 'up').sort((a, q) => hdist(a.c, a.r, b.c, b.r) - hdist(q.c, q.r, b.c, b.r))[0];
    this.moveAll(ov, {x:b.x, y:b.y}, nn ? nn.team : 0, {});
    const cands = this.P.filter(p => p.state === 'up' && hdist(p.c, p.r, b.c, b.r) <= 1);
    if(cands.length && (rnd() < .7 || b.t > 4)){
      const w = pick(cands);
      if(this.free(b.c, b.r)) this.setPos(w, b.c, b.r);
      this.giveBall(w, {fresh:true, hold:1});
      this.log(`Ballon récupéré au sol par ${this.club[w.team].court}.`, 'turn', w.team);
    }
  }
  dropResult(){
    const b = this.ball, t = b.team;
    if(b.ok){
      this.addPoints(t, 3); this.st[t].drops++;
      this.log(`DROP RÉUSSI ! +3 pour ${this.club[t].court}.`, 'try', t); this.fx('cheer', t); this.say(`Le drop passe ! Trois points pour ${this.club[t].court}.`, 2); this.banner('DROP !', t, `${this.score[0]} – ${this.score[1]}`);
      this.endPoss(); this.afterScore(t);
    } else {
      this.log(`Le drop passe à côté.`, 'info', t);
      this.ball = {state:'dead', x:b.tx, y:b.ty, z:0};
      this.startKickoff(1 - t, true);
    }
  }

  // ----- Mêlée -----
  startScrum(c, r, feed, reason){
    this.ball = {state:'dead', x:hx(c, r), y:hy(r), z:0};
    if(this.hooter()){ this.endHalf(); return; }
    if(this.pr && this.pr.team !== feed) this.endPoss(-.3);
    if(!this.pr) this.poss = -1;
    const x = clamp(hx(c, r), TRY_L + 2.3, TRY_R - 2.3), y = clamp(hy(r), 3 * ROW_H, FIELD_W - 3 * ROW_H);
    const [mc, mr] = toHex(x, y), mx = hx(mc, mr), my = hy(mr);
    const d = this.dir(feed), o = 1 - feed, s = this.openSide({x:mx, y:my}), W = FIELD_W;
    const PK = {1:[1,-1], 2:[1,0], 3:[1,1], 4:[2,-1], 5:[2,1], 6:[2,-2], 7:[2,2], 8:[3,0]};
    const L = [];
    for(const tm of [feed, o]){
      const sg = tm === feed ? -d : d;
      for(let n = 1; n <= 8; n++){ const [dp, ro] = PK[n]; L.push({p:this.byNum(tm, n), x:mx + sg * dp, y:my + ro * ROW_H}); }
    }
    L.push({p:this.byNum(feed, 9), x:mx, y:my - s * 3 * ROW_H});
    L.push({p:this.byNum(o, 9), x:mx + d * 1.5, y:my - s * 3 * ROW_H});
    const wingOpen = (tm) => { const dt = this.dir(tm); return ((-dt) === s) ? 11 : 14; };
    const ox = mx - d * 4.5, ox2 = mx + d * 4.5;
    const fo = wingOpen(feed), fb = fo === 11 ? 14 : 11;
    L.push({p:this.byNum(feed, 10), x:ox - d * 1.2, y:my + s * 3}, {p:this.byNum(feed, 12), x:ox - d * 1.8, y:my + s * 6},
           {p:this.byNum(feed, 13), x:ox - d * 2.4, y:my + s * 9}, {p:this.byNum(feed, 15), x:ox - d * 5, y:my + s * 5},
           {p:this.byNum(feed, fo), x:ox - d * 2.6, y:s > 0 ? W - 1 : 1}, {p:this.byNum(feed, fb), x:ox - d * 1.5, y:my - s * 4.5});
    const oo = wingOpen(o), ob = oo === 11 ? 14 : 11;
    L.push({p:this.byNum(o, 10), x:ox2, y:my + s * 3}, {p:this.byNum(o, 12), x:ox2, y:my + s * 6},
           {p:this.byNum(o, 13), x:ox2, y:my + s * 9}, {p:this.byNum(o, 15), x:ox2 + d * 7, y:MID_Y},
           {p:this.byNum(o, oo), x:ox2 + d * .6, y:my + s * 12}, {p:this.byNum(o, ob), x:ox2, y:my - s * 4.5});
    L.forEach(it => { it.y = clamp(it.y, .6, W - .6); });
    this.ball = {state:'dead', x:mx, y:my, z:0};
    this.marks = {kind:'scrum', x:mx, y:my, lines:[[ox, feed], [ox2, o]]};
    this.log(`Mêlée pour ${this.club[feed].court} (${reason}).`, 'set', feed); this.fx('whistle');
    this.arrange(L, 6, () => {
      this.phase = 'scrum'; this.ph = {t:0, feed, mc, mr, mx, my, dom:0, pack:[]};
      const seen = new Set();
      for(const tm of [0, 1]) for(let n = 1; n <= 8; n++){ const p = this.byNum(tm, n); if(seen.has(p)) continue; seen.add(p); p.state = 'bind'; this.ph.pack.push(p); }
    });
  }
  freeAvoiding(p, avoid){
    const seen = new Set([p.r * COLS + p.c]); let fr = [[p.c, p.r]];
    for(let ring = 0; ring < 8; ring++){
      const nx = [];
      for(const [c, r] of fr) for(const [a, b] of neighbors(c, r)){
        const k = b * COLS + a; if(seen.has(k)) continue; seen.add(k);
        if(this.free(a, b) && !avoid.has(k)) return [a, b];
        nx.push([a, b]);
      }
      fr = nx;
    }
    return null;
  }
  shiftGroup(group, dc){
    group = [...new Set(group)].filter(p => this.active(p) && p.c >= 0);
    const set = new Set(group.map(p => p.id)), targets = new Set();
    for(const p of group){ const nc = p.c + dc; if(!inGrid(nc, p.r)) return false; targets.add(p.r * COLS + nc); }
    for(const k of targets){
      const oc = this.occ[k];
      if(oc >= 0 && !set.has(oc)){
        const other = this.P[oc], h = this.freeAvoiding(other, targets);
        if(!h) return false;
        this.setPos(other, h[0], h[1]);
      }
    }
    for(const p of group) if(this.occ[p.r * COLS + p.c] === p.id) this.occ[p.r * COLS + p.c] = -1;
    for(const p of group){ p.c += dc; p.x = hx(p.c, p.r); this.occ[p.r * COLS + p.c] = p.id; }
    return true;
  }
  ph_scrum(){
    const S = this.ph; S.t++;
    const F = S.feed, O = 1 - F, Ef = this.eff[F], Eo = this.eff[O];
    this.slow(S.t >= 2 ? 1.6 : 1.2);
    if(S.t === 3){
      S.dom = (Ef.melee - Eo.melee) + (rnd() * 24 - 12);
      if(Math.abs(S.dom) > 10){
        const win = S.dom > 0 ? F : O;
        if(this.shiftGroup(S.pack, this.dir(win))){ S.mc += this.dir(win); S.mx = hx(S.mc, S.mr); this.ball.x = S.mx; }
        this.log(`La mêlée de ${this.club[win].court} avance !`, 'set', win);
      }
    }
    if(S.t < 5) return;
    for(const p of S.pack) p.state = 'up';
    this.marks = null;
    const pPen = (.07 + Math.max(0, Math.abs(S.dom) - 8) / 90 + (70 - Math.min(Ef.discipline, Eo.discipline)) / 600 + (this.ctx.terrain === 'lourd' ? .03 : 0)) * this.ctx.ref.sev;
    if(rnd() < pPen){
      const ben = S.dom >= 0 ? F : O;
      this.awardPenalty(ben, S.mc, S.mr, 'mêlée écroulée'); return;
    }
    const win = rnd() < clamp(.9 + S.dom / 220, .6, .98) ? F : O;
    this.st[F].scrumFeeds++;
    if(win === F) this.st[F].scrumWon++; else { this.st[O].scrumSteals++; this.log(`Ballon volé en mêlée par ${this.club[O].court} !`, 'turn', O); }
    const nine = this.byNum(win, 9), dt = this.dTry(win, S.mx);
    this.ball.x = nine.x; this.ball.y = nine.y;
    let intent = this.setPieceIntent(win, S.mx);
    if(dt <= 3 && rnd() < .5) intent = 'pick';
    const ck = intent === 'ten' ? this.maybeCombo(win, 'scrum', S.mx) : null;
    const holder = ck === 'n8' ? this.byNum(win, 8) : nine;
    this.giveBall(holder, {fresh:true, intent:ck ? null : intent, ax:S.mx, ay:S.my});
    this.phase = 'open';
    if(ck) this.startCombo(ck, win, 'scrum');
  }

  // ----- Touche -----
  startLineout(x, top, thr){
    x = clamp(x, TRY_L + 2.3, TRY_R - 2.3);
    const W = FIELD_W, sg = top ? 1 : -1, y0 = top ? 0 : W;
    this.ball = {state:'dead', x, y:y0, z:0};
    if(this.hooter()){ this.endHalf(); return; }
    if(this.pr && this.pr.team !== thr) this.endPoss(0);
    if(!this.pr) this.poss = -1;
    const d = this.dir(thr), o = 1 - thr, L = [];
    [1,3,4,5,6,7,8].forEach((n, i) => {
      L.push({p:this.byNum(thr, n), x:x - d * .5, y:y0 + sg * (1.8 + i * .95)});
      L.push({p:this.byNum(o, n), x:x + d * .5, y:y0 + sg * (1.8 + i * .95)});
    });
    L.push({p:this.byNum(thr, 2), x, y:y0}, {p:this.byNum(o, 2), x:x + d * 1.5, y:y0 + sg * .9});
    L.push({p:this.byNum(thr, 9), x:x - d * 1.2, y:y0 + sg * 9.5}, {p:this.byNum(o, 9), x:x + d * 1.5, y:y0 + sg * 9.5});
    const far = y0 + sg * (W - 1), near = y0 + sg * 3;
    const wf = t => { const dt = this.dir(t); const sideFar = -sg; return (-dt === sideFar) ? 11 : 14; };
    const tf = wf(thr), tn = tf === 11 ? 14 : 11, of = wf(o), on = of === 11 ? 14 : 11;
    L.push({p:this.byNum(thr, 10), x:x - d * 4.4, y:y0 + sg * 11}, {p:this.byNum(thr, 12), x:x - d * 5, y:y0 + sg * 14},
           {p:this.byNum(thr, 13), x:x - d * 5.6, y:y0 + sg * 17.5}, {p:this.byNum(thr, 15), x:x - d * 8, y:y0 + sg * 14},
           {p:this.byNum(thr, tf), x:x - d * 5.8, y:far}, {p:this.byNum(thr, tn), x:x - d * 7, y:near});
    L.push({p:this.byNum(o, 10), x:x + d * 4.4, y:y0 + sg * 11}, {p:this.byNum(o, 12), x:x + d * 4.4, y:y0 + sg * 14},
           {p:this.byNum(o, 13), x:x + d * 4.4, y:y0 + sg * 17.5}, {p:this.byNum(o, 15), x:x + d * 10, y:MID_Y},
           {p:this.byNum(o, of), x:x + d * 5, y:far}, {p:this.byNum(o, on), x:x + d * 7, y:near});
    L.forEach(it => { it.y = clamp(it.y, 0, W); });
    this.marks = {kind:'lineout', x, y:y0, lines:[[x - d * 3.7, thr], [x + d * 3.7, o]]};
    this.log(`Touche pour ${this.club[thr].court}.`, 'set', thr);
    this.arrange(L, 6, () => { this.phase = 'lineout'; this.ph = {t:0, thr, x, top, y0, sg}; });
  }
  ph_lineout(){
    const Lo = this.ph; Lo.t++;
    this.slow(1.6);
    const T = Lo.thr, O = 1 - T;
    if(Lo.t === 1){
      Lo.jn = pick([4, 5, 6, 4, 5, 7]);
      const hk = this.byNum(T, 2), jp = this.byNum(T, Lo.jn);
      this.ball = {state:'flight', kind:'throw', x:hk.x, y:hk.y, fx:hk.x, fy:hk.y, tx:jp.x, ty:jp.y, ft:0, dur:2, h:1.4, z0:.6, z1:1.5, team:T};
      this.st[T].lineouts++;
      return;
    }
    if(Lo.t < 3) { this.ball.ft++; return; }
    this.ball.ft = this.ball.dur;
    this.marks = null;
    const Et = this.eff[T], Eo = this.eff[O];
    if(rnd() < .03){
      this.log(`Lancer pas droit !`, 'info', T);
      const [c, r] = toHex(Lo.x, Lo.y0 + Lo.sg * 6); this.startScrum(c, r, O, 'lancer pas droit'); return;
    }
    const win = rnd() < clamp(.86 + (Et.touche - Eo.touche) / 170, .6, .97) ? T : O;
    const jt = this.byNum(T, Lo.jn);
    const jumper = win === T ? jt : this.nearestUp(O, jt.c, jt.r, 1, p => p.fw && p.num !== 2) || this.byNum(O, 4);
    if(win === T) this.st[T].lineoutsWon++; else { this.st[O].lineoutSteals++; this.log(`Touche volée par le ${this.pn(jumper)} !`, 'turn', O); }
    this.ball = {state:'dead', x:jumper.x, y:jumper.y, z:0};
    this.giveBall(jumper, {fresh:true});
    const dt = this.dTry(win, Lo.x);
    const maul = win === T && !this.hooter() && (dt <= 7 ? rnd() < .7 : this.plan[T].atk === 'AV' ? rnd() < .45 : rnd() < .15);
    if(maul){ this.startMaul(jumper); return; }
    this.phase = 'open';
    const n9 = this.byNum(win, 9);
    let it9 = this.setPieceIntent(win, Lo.x);
    const ck = it9 === 'ten' ? this.maybeCombo(win, 'lineout', Lo.x) : null;
    if(ck) it9 = null;
    if(n9 !== jumper && this.validPass(jumper, n9, 10)) this.passBall(jumper, n9, {sure:true, intent:it9});
    else this.giveBall(jumper === n9 ? jumper : n9, {intent:it9});
    if(ck && this.ball.state === 'carried' && this.ball.carrier.team === win) this.startCombo(ck, win, 'lineout');
  }

  // ----- Maul -----
  startMaul(car){
    const t = car.team, o = 1 - t, d = this.dir(t);
    const att = this.P.filter(p => p.team === t && p.fw && p !== car).sort((a, b) => hdp(a, car) - hdp(b, car)).slice(0, 4);
    const def = this.P.filter(p => p.team === o && p.fw).sort((a, b) => hdp(a, car) - hdp(b, car)).slice(0, 4);
    const AO = [[-1, 0], [-.5, -ROW_H], [-.5, ROW_H], [-1.5, -ROW_H]], DO = [[1, 0], [.5, -ROW_H], [.5, ROW_H], [1.5, ROW_H]];
    const L = [{p:car, x:car.x, y:car.y}];
    att.forEach((p, i) => L.push({p, x:car.x + d * AO[i][0], y:car.y + AO[i][1]}));
    def.forEach((p, i) => L.push({p, x:car.x + d * DO[i][0], y:car.y + DO[i][1]}));
    const inMaul = new Set(L.map(it => it.p));
    for(const p of this.P) if(!inMaul.has(p)) L.push({p, x:p.x, y:p.y});
    L.forEach(it => { it.y = clamp(it.y, 0, FIELD_W); });
    this.log(`Ballon porté ! ${this.club[t].court} lance le maul.`, 'set', t);
    this.arrange(L, 3, () => {
      const players = [car, ...att, ...def];
      players.forEach(p => p.state = 'bind');
      this.ball = {state:'carried', carrier:car, x:car.x, y:car.y, z:0};
      this.phase = 'maul'; this.ph = {t:0, att:t, car, players, pushes:0, stalls:0};
    });
  }
  ph_maul(){
    const M = this.ph, t = M.att, o = 1 - t, d = this.dir(t);
    M.t++; this.slow(1.3);
    this.moveAll(new Map(), {x:M.car.x, y:M.car.y}, t, {lineX:M.car.x + d * 2.2});
    if(M.t % 2) return;
    M.pushes++;
    const Ea = this.eff[t], Eo = this.eff[o], dt = this.dTry(t, M.car.x);
    const A = Ea.melee * .6 + Ea.attaque * .4 + rnd() * 26 + (dt <= 3 ? 4 : 0), D = Eo.melee * .6 + Eo.defense * .4 + rnd() * 26;
    if(rnd() < .05 * this.ctx.ref.sev){ M.players.forEach(p => p.state = 'up'); this.awardPenalty(t, M.car.c, M.car.r, 'maul écroulé'); return; }
    if(A > D + 2 && this.shiftGroup(M.players, d)){ M.stalls = 0; this.st[t].metres += M_PER_U; }
    else M.stalls++;
    this.ball.x = M.car.x; this.ball.y = M.car.y;
    if(this.inOppIngoal(M.car)){
      M.players.forEach(p => p.state = 'up');
      this.log(`Essai en bout de maul !`, 'try', t);
      this.scoreTry(M.car); return;
    }
    if(M.stalls >= 2 || M.pushes >= 6){
      M.players.forEach(p => p.state = 'up');
      const nine = this.byNum(t, 9);
      this.phase = 'open';
      this.log(`Le maul est arrêté, ballon sorti.`, 'info', t);
      if(nine !== M.car && nine.state === 'up' && this.validPass(M.car, nine, 10)) this.passBall(M.car, nine, {sure:true, intent:this.setPieceIntent(t, M.car.x)});
      else if(nine !== M.car && nine.state === 'up') this.giveBall(nine, {intent:this.setPieceIntent(t, M.car.x)});
      else this.giveBall(M.car, {intent:'crash'});
    }
  }

  // ----- Cartons, blessures, remplacements -----
  removeFromField(p){ if(p.c >= 0 && this.occ[p.r * COLS + p.c] === p.id) this.occ[p.r * COLS + p.c] = -1; p.c = -1; p.r = -1; }
  card(p, color, reason){
    const t = p.team;
    if(this.ball.carrier === p) return;
    this.removeFromField(p);
    if(color === 'jaune'){ p.state = 'bin'; p.binT = Math.round(this.halfTicks / 4); this.st[t].yellow++; }
    else { p.state = 'off'; this.st[t].red++; this.sheet[t].out.push({nom:p.nom || 'n°' + p.num, why:'rouge'}); }
    this.log(`${color === 'jaune' ? '🟨 Carton jaune' : '🟥 Carton rouge'} pour le ${this.pn(p)} (${reason}). ${this.club[t].court} ${color === 'jaune' ? 'à 14 pendant 10 minutes' : 'finira à 14'}.`, 'card', t);
    this.banner(color === 'jaune' ? 'CARTON JAUNE' : 'CARTON ROUGE', t, p.nom || ROLES[p.num].n);
    this.fx('whistle'); this.fx('ooh');
    this.say(`Carton ${color} pour ${this.spk(p)} !`, 2);
  }
  returnFromBin(p){
    const d = this.dir(p.team), h = this.nearestFree(HALFWAY - d * 2, FIELD_W - .5);
    this.setPos(p, h[0], h[1]); p.ox = p.x; p.oy = p.y; p.state = 'up'; p.groundT = 0;
    this.log(`Retour du ${this.pn(p)} après son carton jaune.`, 'info', p.team);
  }
  swapIn(p, b, why){
    const t = p.team, old = p.nom || 'n°' + p.num;
    this.sheet[t].out.push({nom:old, why});
    b.used = true;
    Object.assign(p, this.playerStats(t, p.num, b), {fat:0, entered:true});
    this.st[t].subs++;
    return old;
  }
  benchFor(t, n){ return this.bench[t].find(b => !b.used && COVERS[n].includes(b.poste)) || this.bench[t].find(b => !b.used && (b.poste <= 8) === (n <= 8)); }
  injure(p){
    const t = p.team;
    if(this.headless === 'none') return;
    const commo = rnd() < .25, matches = commo ? 2 : pick([1, 1, 2, 3, 4]);
    (this.injuries || (this.injuries = [])).push({team:t, nom:p.nom, n:matches});
    this.st[t].inj++;
    const b = this.benchFor(t, p.num);
    if(b && !p.entered){
      const old = this.swapIn(p, b, commo ? 'commotion' : 'blessure');
      this.log(`🩹 ${old} (${this.club[t].court}) sort sur ${commo ? 'protocole commotion' : 'blessure'}, remplacé par ${p.nom}.`, 'inj', t);
    } else if(b){
      const old = this.swapIn(p, b, commo ? 'commotion' : 'blessure');
      this.log(`🩹 ${old} (${this.club[t].court}) touché, remplacé par ${p.nom}.`, 'inj', t);
    } else { p.fat = Math.min(1, p.fat + .3); this.log(`🩹 ${this.pn(p)} touché, il reste sur le terrain diminué (plus de remplaçant).`, 'inj', t); }
  }
  doSubs(t){
    const prog = this.halfTick / this.halfTicks; let done = 0;
    for(const b of this.bench[t]){
      if(b.used || done >= 3) continue;
      const cand = this.P.filter(p => p.team === t && this.active(p) && COVERS[p.num].includes(b.poste) && !p.entered && p !== this.ball.carrier)
        .sort((x, y) => y.fat - x.fat)[0];
      if(!cand) continue;
      const need = cand.fat > .5 || (prog > .55 && cand.fat > .35) || (prog > .75 && cand.fat > .2);
      if(!need) continue;
      const old = this.swapIn(cand, b, 'remplacé');
      done++;
      this.log(`🔄 ${this.club[t].court} : ${cand.nom} entre à la place de ${old}.`, 'sub', t);
    }
  }

  // ----- Pénalités & tirs au but -----
  bestKicker(t){ return this.P.filter(p => p.team === t && this.active(p)).reduce((a, b) => a.kick > b.kick ? a : b); }
  goalProb(k, x, y, t){
    const dx = Math.abs(this.oppTry(t) - x), dy = Math.abs(y - MID_Y);
    const dist = Math.hypot(dx, dy) * M_PER_U, lat = dy * M_PER_U;
    const cx = this.ctx, d = this.dir(t);
    const env = -.03 * cx.rain - .04 * cx.wind + .03 * cx.wind * cx.windDir * d + (t === 0 ? .02 : 0) - (cx.cold ? .01 : 0);
    return clamp((k.kick / 100) * 1.15 - dist * .0075 - lat * .007 + env, .03, .96);
  }
  awardPenalty(t, c, r, reason, offender){
    const o = 1 - t, x = hx(c, r), y = hy(r), d = this.dir(t);
    this.st[o].pens++;
    // cartons : geste dangereux ou fautes répétées dans ses 22 m
    this.pen22 = this.pen22 || [0, 0];
    if(this.dTry(t, x) <= 8.2) this.pen22[o]++;
    let pY = reason === 'plaquage haut' ? .3 : .02, pR = reason === 'plaquage haut' ? .05 : 0;
    if(this.dTry(t, x) <= 8.2 && this.pen22[o] >= 3){ pY = Math.max(pY, .3); reason += ', fautes répétées'; }
    pY *= this.ctx.ref.cartons; pR *= this.ctx.ref.cartons;
    const u = rnd();
    if(u < pY + pR){
      const who = (offender && this.active(offender)) ? offender : this.P.filter(p => p.team === o && p.state !== 'bin' && p.state !== 'off').sort((a, b) => hdist(a.c, a.r, c, r) - hdist(b.c, b.r, c, r))[0];
      if(who) this.card(who, u < pR ? 'rouge' : 'jaune', reason);
      if(this.pen22[o] >= 3) this.pen22[o] = 0;
    }
    this.ball = {state:'dead', x, y, z:0};
    if(this.pr && this.pr.team !== t) this.endPoss(-.5);
    if(!this.pr || this.poss !== t){ this.poss = -1; this.changePoss(t); }
    this.marks = {kind:'pen', x, y, lines:[[x + d * 3.7, o]]};
    this.log(`Pénalité pour ${this.club[t].court} (${reason}).`, 'pen', t);
    this.fx('whistle'); this.say(`Pénalité pour ${this.club[t].court}, ${reason}.`, 0);
    for(const p of this.P){ if(p.state !== 'up' && this.active(p)){ p.state = 'up'; p.groundT = 0; } }
    const kicker = this.bestKicker(t), pg = this.goalProb(kicker, x, y, t), dt = this.dTry(t, x);
    const diff = this.score[t] - this.score[o];
    let choice;
    if(this.hooter()){ choice = (pg >= .3 && diff <= 2) || (pg >= .45) ? 'goal' : 'end'; }
    else if(pg >= .58 && !(dt <= 5 && this.plan[t].atk === 'AV' && diff < 0 && rnd() < .5)) choice = 'goal';
    else if(dt <= 10 && rnd() < .75) choice = 'touch';
    else if(rnd() < (this.plan[t].atk === 'MO' ? .25 : .1)) choice = 'tap';
    else choice = (dt < 6 && rnd() < .3) ? 'scrum' : 'touch';
    if(choice === 'end'){ this.log(`${this.club[t].court} tape le ballon en touche : fin de la période.`, 'info', t); this.endHalf(); return; }
    if(choice === 'goal'){ this.banner('PÉNALITÉ', t, 'Tentative au but'); this.startGoalKick(t, x, y, 'pen'); return; }
    if(choice === 'scrum'){ this.log(`${this.club[t].court} choisit la mêlée.`, 'info', t); this.startScrum(c, r, t, 'choix après pénalité'); return; }
    this.banner('PÉNALITÉ', t, choice === 'touch' ? 'Pénaltouche' : 'Jouée à la main');
    const kp = choice === 'touch' ? kicker : (this.nearestUp(t, c, r) || kicker);
    this.phase = 'penwait';
    this.ph = {t:3, team:t, x, y, kp, choice};
  }
  ph_penwait(){
    const P = this.ph, d = this.dir(P.team);
    const [kc, kr] = toHex(P.x, P.y);
    const ov = new Map([[P.kp, [kc, kr]]]);
    this.moveAll(ov, {x:P.x, y:P.y}, P.team, {lineX:P.x + d * 3.8});
    if(--P.t > 0) return;
    if(P.kp.c !== kc || P.kp.r !== kr){ if(this.free(kc, kr)) this.setPos(P.kp, kc, kr); }
    this.marks = null;
    if(P.choice === 'touch'){
      const W = FIELD_W;
      let tx = P.x + d * (8 + P.kp.kick / 100 * 7);
      tx = d > 0 ? Math.min(tx, TRY_R - 2.3) : Math.max(tx, TRY_L + 2.3);
      const ty = P.y < MID_Y ? -1.2 : W + 1.2;
      this.log(`Le ${this.pn(P.kp)} trouve la touche.`, 'kick', P.team);
      this.kickBall(P.kp, tx, ty, 'pentouch', 2.6);
      this.phase = 'open';
    } else {
      this.log(`Pénalité jouée rapidement à la main !`, 'break', P.team);
      this.giveBall(P.kp, {fresh:true, intent:'crash'});
      this.phase = 'open';
    }
  }
  startGoalKick(t, x, y, type){
    const d = this.dir(t), o = 1 - t, kicker = this.bestKicker(t), W = FIELD_W;
    let gx = x, gy = y;
    if(type === 'conv'){ gy = clamp(y, .8, W - .8); gx = this.oppTry(t) - d * (3 + Math.abs(gy - MID_Y) * .22); }
    const L = [{p:kicker, x:gx - d * .5, y:gy}];
    this.P.filter(p => p.team === t && p !== kicker).forEach((p, i) => L.push({p, x:gx - d * (4.5 + (i % 3) * 1.2), y:clamp(gy + (i - 7) * 1.3, .6, W - .6)}));
    this.P.filter(p => p.team === o).forEach((p, i) => {
      if(type === 'conv') L.push({p, x:this.oppTry(t) + d * (.7 + (i % 2) * .9), y:clamp(MID_Y + (i - 7) * 1.5, .6, W - .6)});
      else L.push({p, x:gx + d * (4.5 + (i % 3)), y:clamp(gy + (i - 7) * 1.4, .6, W - .6)});
    });
    const pg = this.goalProb(kicker, gx, gy, t);
    this.ball = {state:'dead', x:gx, y:gy, z:0};
    this.marks = {kind:'goal', x:gx, y:gy, lines:[]};
    this.arrange(L, 5, () => { this.phase = 'goal'; this.ph = {t:0, type, team:t, kicker, pg, gx, gy}; this.ball = {state:'dead', x:gx, y:gy, z:0}; });
  }
  ph_goal(){
    const G = this.ph; G.t++;
    if(G.t === 2){
      G.ok = rnd() < G.pg;
      const d = this.dir(G.team), tx = this.oppTry(G.team) + d * .6;
      const ty = G.ok ? MID_Y + (rnd() - .5) * 1.2 : MID_Y + (rnd() < .5 ? -1 : 1) * (1.3 + rnd() * 1.6);
      this.ball = {state:'flight', kind:'goal', x:G.gx, y:G.gy, fx:G.gx, fy:G.gy, tx, ty, ft:0, dur:5, h:3.2, z0:0, z1:G.ok ? 1.8 : 1.4, team:G.team};
      if(G.type === 'conv') this.st[G.team].convA++; else this.st[G.team].pgA++;
      this.fx('kick');
      return;
    }
    if(G.t >= 2) this.slow(1.35);
    if(G.t > 2){ this.ball.ft++; if(this.ball.ft >= this.ball.dur) this.goalResult(); }
  }
  goalResult(){
    const G = this.ph, t = G.team;
    this.marks = null;
    if(G.ok){
      const pts = G.type === 'conv' ? 2 : 3;
      this.addPoints(t, pts);
      this.fx('cheer', t);
      if(G.type === 'conv'){ this.st[t].conv++; this.log(`Transformation réussie (+2).`, 'goal', t); this.say(`Transformation réussie.`, 0); }
      else { this.st[t].pg++; this.say(`La pénalité passe, trois points pour ${this.club[t].court}.`, 1); this.log(`Pénalité réussie ! +3 pour ${this.club[t].court}.`, 'try', t); this.banner('+3', t, `${this.score[0]} – ${this.score[1]}`); }
    } else this.log(G.type === 'conv' ? `Transformation manquée.` : `La pénalité n'est pas passée.`, 'info', t);
    this.endPoss();
    if(G.type === 'conv' || G.ok) this.afterScore(t);
    else { this.ball = {state:'dead', x:this.oppTry(t), y:MID_Y, z:0}; this.startKickoff(1 - t, true); }
  }
  afterScore(t){
    if(this.hooter()){ this.endHalf(); return; }
    this.startKickoff(1 - t);
  }
  scoreTry(p, onLine = false){
    const t = p.team;
    this.addPoints(t, 5); this.tries[t]++; this.st[t].tries++; this.slow(2);
    this.fx('try', t);
    this.say(`Essai ! ${this.spk(p)} aplatit pour ${this.club[t].court} ! ${this.score[0]} à ${this.score[1]}.`, 2);
    this.log(`ESSAI ! Le ${this.pn(p)} aplatit${onLine ? ' au ras de la ligne' : ''} !`, 'try', t);
    this.banner('ESSAI !', t, `${this.club[t].court} · ${this.score[0]} – ${this.score[1]}`);
    this.ball = {state:'dead', x:p.x, y:p.y, z:0};
    for(const q of this.P) if(q.state !== 'up' && this.active(q)){ q.state = 'up'; q.groundT = 0; }
    this.phase = 'celebrate';
    this.ph = {t:7, scorer:p, then:() => this.startGoalKick(t, 0, p.y, 'conv')};
  }
  ph_celebrate(){
    const C = this.ph;
    for(const q of this.P) if(q.team === C.scorer.team && q !== C.scorer && q.state === 'up' && q.c >= 0 && hdp(q, C.scorer) <= 7) this.moveGated(q, C.scorer.c, C.scorer.r);
    if(--C.t <= 0) C.then();
  }

  // ----- Mi-temps / fin -----
  endHalf(){
    if(this.pr) this.endPoss();
    this.poss = -1; this.marks = null;
    for(const p of this.P){ if(this.active(p)){ p.state = 'up'; p.groundT = 0; } p.fat *= .85; }
    if(this.half === 1){
      this.log(`MI-TEMPS : ${this.club[0].court} ${this.score[0]} – ${this.score[1]} ${this.club[1].court}`, 'half');
      this.banner('MI-TEMPS', -1, `${this.score[0]} – ${this.score[1]}`);
      this.fx('whistleLong'); this.say(`C'est la mi-temps. ${this.club[0].court} ${this.score[0]}, ${this.club[1].court} ${this.score[1]}.`, 2);
      this.phase = 'halftime'; this.ph = {t:this.headless ? 1 : 12};
    } else this.finish();
  }
  ph_halftime(){
    if(--this.ph.t > 0) return;
    this.half = 2; this.halfTick = 0; this.left = 1 - this.left;
    this.log(`Reprise de la 2e mi-temps, les équipes changent de côté.`, 'info');
    this.startKickoff(1 - this.firstKick);
  }
  finish(){
    this.over = true; this.phase = 'end';
    const [a, b] = this.score;
    const w = a > b ? 0 : b > a ? 1 : -1;
    this.log(`COUP DE SIFFLET FINAL : ${this.club[0].court} ${a} – ${b} ${this.club[1].court}${w >= 0 ? ` · victoire de ${this.club[w].nom}` : ' · match nul'}.`, 'end');
    this.fx('whistleEnd', w);
    this.say(`Coup de sifflet final ! ${w >= 0 ? `Victoire de ${this.club[w].court}, ${Math.max(a, b)} à ${Math.min(a, b)}.` : `Match nul, ${a} partout.`}`, 2);
    this.banner(w >= 0 ? `VICTOIRE ${this.club[w].court.toUpperCase()}` : 'MATCH NUL', w, `${a} – ${b}`);
  }
  phaseLabel(){
    const b = this.ball;
    switch(this.phase){
      case 'arrange': return 'Mise en place';
      case 'kickwait': return 'Coup d\'envoi';
      case 'ruck': return 'Ruck';
      case 'scrum': return this.ph.t <= 1 ? 'Mêlée : flexion…' : this.ph.t === 2 ? 'Mêlée : liez…' : this.ph.t === 3 ? 'Mêlée : jeu !' : 'Mêlée : poussée';
      case 'lineout': return 'Touche';
      case 'maul': return 'Maul';
      case 'penwait': return 'Pénalité';
      case 'goal': return this.ph.type === 'conv' ? 'Transformation' : 'Pénalité au but';
      case 'celebrate': return 'Essai !';
      case 'halftime': return 'Mi-temps';
      case 'end': return 'Terminé';
      case 'open': return b.state === 'flight' ? (b.kind === 'pass' ? 'Passe' : 'Ballon en l\'air') : b.state === 'loose' ? 'Ballon au sol' : 'Jeu courant';
      default: return '';
    }
  }
}

// =====================================================================
//  RÉSULTATS, EXPÉRIENCE, CHAMPIONNAT
// =====================================================================
const SST_KEYS = ['conv','convA','pg','pgA','drops','metres','breaks','passes','offloads','tackles','missed','turnovers','intercepts',
  'rucks','rucksWon','scrumFeeds','scrumWon','lineouts','lineoutsWon','knock','pens','yellow','red','combos','combosOk'];
function applyResult(m, opt = {}){
  const [h, a] = m.ids, [sh, sa] = m.score, [th, ta] = m.tries;
  const res = [{id:h, pf:sh, pa:sa, tf:th, ta:ta}, {id:a, pf:sa, pa:sh, tf:ta, ta:th}];
  const report = [];
  res.forEach((r, i) => {
    const T = DB.teams[r.id], c = CLUB[r.id];
    const win = r.pf > r.pa, draw = r.pf === r.pa;
    T.career.J++; if(win) T.career.G++; else if(draw) T.career.N++; else T.career.P++;
    T.form.unshift(win ? 'V' : draw ? 'N' : 'D'); T.form = T.form.slice(0, 6);
    const lv0 = level(r.id);
    T.xp += win ? 3 : draw ? 2 : 1;
    const me = effStats(r.id), op = effStats(res[1 - i].id);
    const grow = (k, g) => { const idx = STAT_KEYS.indexOf(k), cap = Math.min(15, 99 - c.s[idx]); const before = T.bonus[k]; T.bonus[k] = Math.min(cap, T.bonus[k] + g); return T.bonus[k] - before; };
    const lines = [];
    if(win){
      const pool = r.tf > r.ta ? ['attaque', 'passe', 'rapidite', 'pied'] : ['defense', 'melee', 'discipline', 'touche'];
      shuffle(pool).slice(0, 2).forEach(k => { const g = grow(k, .15 + rnd() * .15); if(g > 0) lines.push(`${STAT_LABELS[k]} +${g.toFixed(2)}`); });
    } else {
      let worst = STAT_KEYS[0], wv = 1e9;
      STAT_KEYS.forEach(k => { const v = me[k] - op[k] + rnd() * 2; if(v < wv){ wv = v; worst = k; } });
      const g = grow(worst, .25 + rnd() * .1); if(g > 0) lines.push(`${STAT_LABELS[worst]} +${g.toFixed(2)} (leçon de la ${draw ? 'rencontre' : 'défaite'})`);
    }
    report.push({id:r.id, win, draw, lines, lvUp:level(r.id) > lv0});
    if(opt.fixture){
      const R = T.rec; R.J++; R.pf += r.pf; R.pa += r.pa; R.tf += r.tf; R.ta += r.ta;
      if(win){ R.G++; R.pts += 4; } else if(draw){ R.N++; R.pts += 2; } else R.P++;
      if(r.tf - r.ta >= 3){ R.bo++; R.pts++; }
      if(!win && !draw && r.pa - r.pf <= 5){ R.bd++; R.pts++; }
      const S = T.sst || (T.sst = {}), st = m.st[i], po = st.possT + m.st[1 - i].possT;
      SST_KEYS.forEach(k => S[k] = (S[k] || 0) + st[k]);
      S.poss = (S.poss || 0) + (po ? st.possT / po * 100 : 50); S.n = (S.n || 0) + 1;
      (T.res || (T.res = [])).push({k:opt.kind, o:res[1 - i].id, dom:i === 0, pf:r.pf, pa:r.pa});

  DB.inj = DB.inj || {};
  [h, a].forEach(id => { const I = DB.inj[id] || (DB.inj[id] = {}); for(const k in I) if(--I[k] <= 0) delete I[k]; });
  (m.injuries || []).forEach(j => { if(!j.nom || /^Espoir/.test(j.nom)) return; const I = DB.inj[m.ids[j.team]]; I[j.nom] = Math.max(I[j.nom] || 0, j.n); });
  DB.matches++;
  DB.history.unshift({h, a, sh, sa, th, ta, kind:opt.kind || 'amical', s:DB.season.n});
  DB.history = DB.history.slice(0, 40);

}
function simulate(h, a, opt = {}){
  const m = new Match(h, a, {headless:true, month:opt.month});
  let g = 0; while(!m.over && g++ < 12000) m.step();
  if(!m.over) m.finish();
  const rep = applyResult(m, opt);

}
function standings(){
  return CLUBS.map(c => ({id:c.id, ...DB.teams[c.id].rec}))
    .sort((a, b) => b.pts - a.pts || (b.pf - b.pa) - (a.pf - a.pa) || b.tf - a.tf);
}
function koWinner(m){
  if(m.score[0] !== m.score[1]) return m.score[0] > m.score[1] ? m.ids[0] : m.ids[1];
  if(m.tries[0] !== m.tries[1]) return m.tries[0] > m.tries[1] ? m.ids[0] : m.ids[1];
  return rnd() < .5 ? m.ids[0] : m.ids[1];
}
function runPlayoffs(){
  const S = DB.season, tb = standings().map(r => r.id), out = [];
  const play = (h, a, lbl) => { const {m} = simulate(h, a, {kind:lbl, month:5}); const w = koWinner(m); out.push({lbl, h, a, sh:m.score[0], sa:m.score[1], w}); return w; };
  const b1 = play(tb[2], tb[5], 'Barrage'), b2 = play(tb[3], tb[4], 'Barrage');
  const d1 = play(tb[0], b2, 'Demi-finale'), d2 = play(tb[1], b1, 'Demi-finale');
  const f = play(d1, d2, 'Finale');
  S.playoffs = out; S.champion = f;
  DB.champions.unshift({s:S.n, id:f}); DB.champions = DB.champions.slice(0, 12);
}
function startNewSeason(){
  const n = DB.season.n + 1;
  CLUBS.forEach(c => { const T = DB.teams[c.id]; T.rec = newRec(); T.sst = {}; T.res = []; STAT_KEYS.forEach(k => T.bonus[k] = +(T.bonus[k] * .7).toFixed(2)); });
  DB.season = newSeason(n);
  DB.inj = {};
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const IX = .866, IY = .5, HZ = .62;
let DPR = 1;
const cam = {mode:'wide', zoom:2.2, s:10, cx:21, cy:MID_Y, ox:0, oy:0};
function proj(x, y, z = 0){ return [(x - y) * IX * cam.s + cam.ox, (x + y) * IY * cam.s - z * HZ * cam.s + cam.oy]; }
const S0 = 30, FX0 = -4, FX1 = 47, FY0 = -6, FY1 = FIELD_W + 4;
const OFF_OX = (FY1 - FX0) * IX * S0 + 10, OFF_OY = (-(FX0 + FY0) * IY + 3.2) * S0;
let fieldImg = null;
function offP(x, y, z = 0){ return [(x - y) * IX * S0 + OFF_OX, (x + y) * IY * S0 - z * HZ * S0 + OFF_OY]; }
function buildField(homeId){
  const w = Math.ceil((FX1 - FY0) * IX * S0 + OFF_OX + 20), h = Math.ceil((FX1 + FY1) * IY * S0 + OFF_OY + 20);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const poly = (pts, fill, stroke) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); if(fill){ g.fillStyle = fill; g.fill(); } if(stroke){ g.strokeStyle = stroke; g.stroke(); } };
  // tribunes (côté opposé + derrière un en-but)
  const home = CLUB[homeId] || CLUBS[0];
  const stand = (x0, x1, y0, y1, z0, z1, along) => {
    const P = along === 'x' ? [offP(x0, y0, z0), offP(x1, y0, z0), offP(x1, y1, z1), offP(x0, y1, z1)] : [offP(x0, y0, z0), offP(x0, y1, z0), offP(x1, y1, z1), offP(x1, y0, z1)];
    const gr = g.createLinearGradient(P[0][0], P[0][1], P[3][0], P[3][1]); gr.addColorStop(0, '#1b2438'); gr.addColorStop(1, '#0c1120');
    poly(P, gr);
    const N = along === 'x' ? 1400 : 500;
    for(let i = 0; i < N; i++){
      const u = rnd(), v = rnd();
      const x = along === 'x' ? x0 + (x1 - x0) * u : x0 + (x1 - x0) * v, y = along === 'x' ? y0 + (y1 - y0) * v : y0 + (y1 - y0) * u;
      const z = z0 + (z1 - z0) * (along === 'x' ? v : v);
      const [sx, sy] = offP(x, y, z);
      g.fillStyle = rnd() < .45 ? (rnd() < .5 ? home.c1 : home.c2) : `hsl(${(rnd() * 360) | 0},30%,${35 + rnd() * 35}%)`;
      g.globalAlpha = .55 + rnd() * .4; g.fillRect(sx, sy, 2.2, 2.2); g.globalAlpha = 1;
    }
  };
  stand(-1.5, 44.5, -2.2, -6, .4, 3.6, 'x');
  stand(-2.2, -5, -2, FIELD_W + 2, .4, 3.0, 'y');
  // abords
  poly([offP(-2, -2), offP(45, -2), offP(45, FIELD_W + 2.2), offP(-2, FIELD_W + 2.2)], '#1d4d2a');
  // hexagones
  const R = 1 / SQ3;
  for(let r = 0; r < ROWS; r++) for(let cc = 0; cc < COLS; cc++){
    const x = hx(cc, r), y = hy(r);
    const ingoal = x < TRY_L || x > TRY_R;
    const band = Math.floor((x + 0.25) / 2.6) % 2;
    let L = ingoal ? 30 : (band ? 33 : 29);
    L += (((cc * 7 + r * 13) % 5) - 2) * .5;
    const pts = [];
    for(let k = 0; k < 6; k++){ const a = Math.PI / 6 + k * Math.PI / 3; pts.push(offP(x + Math.cos(a) * R, y + Math.sin(a) * R)); }
    poly(pts, `hsl(${ingoal ? 128 : 112},48%,${L}%)`, 'rgba(0,0,0,.16)');
  }
  // lignes
  g.lineCap = 'round';
  const line = (x0, y0, x1, y1, wdt = 2, dash) => { g.beginPath(); const a = offP(x0, y0), b = offP(x1, y1); g.moveTo(...a); g.lineTo(...b); g.lineWidth = wdt; g.strokeStyle = 'rgba(255,255,255,.88)'; g.setLineDash(dash || []); g.stroke(); g.setLineDash([]); };
  const T0 = -.5, T1 = FIELD_W + .5, DL = -.55, DR = COLS - .45;
  line(DL, T0, DR, T0, 2.4); line(DL, T1, DR, T1, 2.4);
  line(DL, T0, DL, T1, 2.4); line(DR, T0, DR, T1, 2.4);
  line(TRY_L, T0, TRY_L, T1, 3); line(TRY_R, T0, TRY_R, T1, 3);
  line(L22, T0, L22, T1, 2.2); line(R22, T0, R22, T1, 2.2);
  line(HALFWAY, T0, HALFWAY, T1, 2.6);
  line(HALFWAY - 3.7, T0, HALFWAY - 3.7, T1, 1.8, [10, 10]); line(HALFWAY + 3.7, T0, HALFWAY + 3.7, T1, 1.8, [10, 10]);
  line(TRY_L + 1.85, T0, TRY_L + 1.85, T1, 1.5, [6, 14]); line(TRY_R - 1.85, T0, TRY_R - 1.85, T1, 1.5, [6, 14]);
  for(const yy of [T0 + 1.85, T0 + 5.55, T1 - 1.85, T1 - 5.55]) line(TRY_L, yy, TRY_R, yy, 1.4, [6, 18]);
  // panneaux publicitaires côté caméra
  for(let i = 0; i < 12; i++){
    const x0 = 1 + i * 3.4, x1 = x0 + 3, y = FIELD_W + 1.6;
    poly([offP(x0, y, 0), offP(x1, y, 0), offP(x1, y, .45), offP(x0, y, .45)], i % 2 ? '#13254a' : '#0f1d3a', 'rgba(255,255,255,.08)');
    const [tx, ty] = offP((x0 + x1) / 2, y, .22);
    g.save(); g.translate(tx, ty); g.transform(1, Math.tan(Math.PI / 6) * 0.58, 0, 1, 0, 0);
    g.fillStyle = i % 2 ? home.c1 : '#f4c430'; g.font = 'bold 12px Oswald, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(i % 3 === 0 ? 'TOP 14 HEXA' : i % 3 === 1 ? home.court.toUpperCase() : 'RUGBY SIM', 0, 0); g.restore();
  }
  fieldImg = c;
}

function teamColors(m){
  const h = m.club[0], a = m.club[1];
  const hexRgb = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const dist = (p, q) => { const A = hexRgb(p), B = hexRgb(q); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); };
  const lum = s => { const [r, g, b] = hexRgb(s); return (r * .299 + g * .587 + b * .114); };
  let ac1 = a.c1, ac2 = a.c2;
  if(dist(h.c1, a.c1) < 140){ if(dist(a.c2, h.c1) > 170 && dist(a.c2, h.c2) > 90){ ac1 = a.c2; ac2 = a.c1; } else { ac1 = '#f2f2f2'; ac2 = a.c1; } }
  return [
    {c1:h.c1, c2:h.c2, num:lum(h.c1) > 150 ? '#111' : '#fff'},
    {c1:ac1, c2:ac2, num:lum(ac1) > 150 ? '#111' : '#fff'}
  ];
}

function ballPlane(m, al){
  const b = m.ball, pa = m.passAnim;
  if(pa && pa.tick === m.tickN && b.state === 'carried'){
    const u = clamp(al * 1.15, 0, 1);
    if(u < 1) return {x:pa.fx + (pa.tx - pa.fx) * u, y:pa.fy + (pa.ty - pa.fy) * u, z:.55 + pa.h * 4 * u * (1 - u), air:true, u};
  }
  if(b.state === 'carried' && b.carrier){ const p = b.carrier; return {x:p.ox + (p.x - p.ox) * al, y:p.oy + (p.y - p.oy) * al, z:.5, held:true}; }
  if(b.state === 'flight'){
    const u = clamp((b.ft + al) / b.dur, 0, 1);
    const z = (b.z0 || 0) * (1 - u) + (b.z1 || 0) * u + b.h * 4 * u * (1 - u);
    return {x:b.fx + (b.tx - b.fx) * u, y:b.fy + (b.ty - b.fy) * u, z, air:true, u};
  }
  return {x:b.x, y:b.y, z:.08};
}

function drawPlayer(p, x, y, col, m, isCarrier){
  const [sx, sy] = proj(x, y, 0), u = cam.s * 1.25;
  const d = m.dir(p.team), lean = d * u * .07;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(sx, sy, u * .3, u * .15, 0, 0, Math.PI * 2); ctx.fill();
  if(isCarrier){ ctx.strokeStyle = '#f4c430'; ctx.lineWidth = Math.max(1.5, u * .05); ctx.beginPath(); ctx.ellipse(sx, sy, u * .4, u * .2, 0, 0, Math.PI * 2); ctx.stroke(); }

    ctx.save(); ctx.translate(sx, sy - u * .1); ctx.rotate(d > 0 ? .5 : -.5 + Math.PI);
    ctx.fillStyle = col.c1; ctx.beginPath(); ctx.ellipse(0, 0, u * .3, u * .12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col.c2; ctx.fillRect(-u * .3, -u * .03, u * .18, u * .06);
    ctx.fillStyle = '#e7b991'; ctx.beginPath(); ctx.arc(u * .32, 0, u * .09, 0, Math.PI * 2); ctx.fill();

  }
  const bind = p.state === 'bind';
  const legH = bind ? u * .2 : u * .3, bodyH = bind ? u * .28 : u * .4, bw = u * .34, lx = bind ? lean * 2.2 : lean;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(sx - bw * .36, sy - legH, bw * .26, legH);
  ctx.fillRect(sx + bw * .1, sy - legH, bw * .26, legH);
  ctx.fillStyle = col.c2;
  ctx.fillRect(sx - bw * .42, sy - legH - u * .02, bw * .84, u * .1);
  const top = sy - legH - bodyH;
  ctx.fillStyle = col.c1;
  ctx.beginPath();
  ctx.moveTo(sx - bw / 2, sy - legH); ctx.lineTo(sx + bw / 2, sy - legH);
  ctx.lineTo(sx + bw / 2 + lx, top + u * .05); ctx.quadraticCurveTo(sx + lx, top - u * .04, sx - bw / 2 + lx, top + u * .05);

  ctx.fillRect(sx - bw / 2 + lx * .5, top + bodyH * .45, bw, bodyH * .14); ctx.globalAlpha = 1;

}
function drawBall(bp){
  const [gx, gy] = proj(bp.x, bp.y, 0), u = cam.s;
  if(bp.z > .15){ ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(gx, gy, u * .12, u * .06, 0, 0, Math.PI * 2); ctx.fill(); }

  ctx.fillStyle = '#f3efe4'; ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = Math.max(1, u * .025);
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(3, u * .13), Math.max(2, u * .08), 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

}
function drawPosts(x, col){
  const u = cam.s;
  const a = MID_Y - POST_HALF, b = MID_Y + POST_HALF;
  const up = (y) => { const [x0, y0] = proj(x, y, 0), [x1, y1] = proj(x, y, 4.4); ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = Math.max(2, u * .07); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const [p0x, p0y] = proj(x, y, 0), [p1x, p1y] = proj(x, y, .7); ctx.strokeStyle = col; ctx.lineWidth = Math.max(4, u * .16); ctx.beginPath(); ctx.moveTo(p0x, p0y); ctx.lineTo(p1x, p1y); ctx.stroke(); };

  const [c0x, c0y] = proj(x, a, 1.1), [c1x, c1y] = proj(x, b, 1.1);
  ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = Math.max(2, u * .06); ctx.beginPath(); ctx.moveTo(c0x, c0y); ctx.lineTo(c1x, c1y); ctx.stroke();
}

function render(al, view){
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#05080f'); bg.addColorStop(1, '#0d1626');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if(!match || !fieldImg) return;
  const m = view || match;
  const bp = ballPlane(m, al);
  const sFit = Math.min(W / 61, H / 37.5);
  let tx = 21.3, ty = MID_Y, sT = sFit;
  const kf = 1 - Math.exp(-frameDt / 420), kz = 1 - Math.exp(-frameDt / 600);
  if(cam.mode === 'follow' || view){
    let tvz = 1;
    if(!view){
      if(['arrange', 'kickwait', 'scrum', 'lineout', 'goal', 'penwait', 'celebrate', 'halftime'].includes(m.phase)) tvz = .72;
      else if(m.ball.state === 'flight' && m.ball.kind !== 'pass') tvz = .66;
      else if(m.ball.carrier && m.ball.carrier.burst > 0) tvz = 1.15;
    }
    sT = sFit * (view ? Math.max(cam.zoom, 2.6) : cam.zoom * tvz);
    // la caméra ne bouge que quand le ballon sort d'une zone centrale (comme une réalisation TV)
    const dz = (Math.min(W, H) / Math.max(cam.s, 1)) * .16;
    if(cam.fx === undefined){ cam.fx = bp.x; cam.fy = bp.y; }
    let gx = bp.x, gy = bp.y;
    if(!view && m.ball.state === 'flight' && m.ball.kind !== 'pass'){ gx = (bp.x + m.ball.tx) / 2; gy = (bp.y + clamp(m.ball.ty, 0, FIELD_W)) / 2; }
    const ex = gx - cam.fx, ey = gy - cam.fy;
    if(Math.abs(ex) > dz) cam.fx += ex - Math.sign(ex) * dz;
    if(Math.abs(ey) > dz) cam.fy += ey - Math.sign(ey) * dz;
    tx = cam.fx; ty = cam.fy;
  } else { cam.fx = undefined; }
  cam.cx += (tx - cam.cx) * kf; cam.cy += (ty - cam.cy) * kf; cam.s += (sT - cam.s) * kz;
  cam.ox = W / 2 - (cam.cx - cam.cy) * IX * cam.s;
  cam.oy = H / 2 - (cam.cx + cam.cy) * IY * cam.s + (cam.mode === 'wide' && !view ? cam.s * 1.5 : 0);
  const k = cam.s / S0;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fieldImg, cam.ox - OFF_OX * k, cam.oy - OFF_OY * k, fieldImg.width * k, fieldImg.height * k);
  const col = match._col || (match._col = teamColors(match));
  // marques : ligne de hors-jeu, point de mêlée / ruck
  const mk = m.phase === 'ruck' ? {kind:'ruck', x:m.ph.x, y:m.ph.y, lines:[[m.ph.x - m.dir(m.ph.att) * .9, m.ph.att], [m.ph.x + m.dir(m.ph.att) * 1.0, 1 - m.ph.att]]} : m.marks;
  if(mk){
    for(const [lx, tm] of mk.lines){
      const a = proj(lx, -.4), b = proj(lx, FIELD_W + .4);
      ctx.strokeStyle = col[tm].c1 === '#f2f2f2' ? '#ddd' : col[tm].c1; ctx.globalAlpha = .75; ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    const [c, r] = toHex(mk.x, mk.y), R = 1 / SQ3, X = hx(c, r), Y = hy(r);
    ctx.beginPath(); for(let i = 0; i < 6; i++){ const an = Math.PI / 6 + i * Math.PI / 3; const p = proj(X + Math.cos(an) * R, Y + Math.sin(an) * R); i ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.closePath();
    ctx.fillStyle = 'rgba(244,196,48,.35)'; ctx.fill(); ctx.strokeStyle = '#f4c430'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  if(!view){ drawRuns(m, al, col); drawAids(m, al, col); }
  // objets triés par profondeur
  const items = [];
  for(const p of m.P){ if(p.state === 'bin' || p.state === 'off') continue; const x = p.ox + (p.x - p.ox) * al, y = p.oy + (p.y - p.oy) * al; items.push({d:x + y, f:() => drawPlayer(p, x, y, col[p.team], m, m.ball.state === 'carried' && m.ball.carrier === p)}); }
  items.push({d:TRY_L + MID_Y, f:() => drawPosts(TRY_L, col[m.left === 0 ? 1 : 0].c1)});
  items.push({d:TRY_R + MID_Y, f:() => drawPosts(TRY_R, col[m.left].c1)});
  items.push({d:bp.x + bp.y + (bp.air ? .8 + bp.z : .05), f:() => drawBall(bp)});
  items.sort((a, b) => a.d - b.d);
  for(const it of items) it.f();
  // étiquette du porteur de balle
  const car = m.ball.state === 'carried' && m.ball.carrier;
  if(car && m.phase !== 'replay-no'){
    const x = car.ox + (car.x - car.ox) * al, y = car.oy + (car.y - car.oy) * al;
    const [sx, sy] = proj(x, y, 0), u = cam.s * 1.25;

    const e = m.events[logIdx++];

let curDur = TICK_MS, replay = null, snaps = [], frameDt = 16;
const REPLAY_FRAMES = 14, REPLAY_MS = 380;
function snap(){
  const m = match;

  const b = Object.assign({}, m.ball); if(b.carrier) b.carrier = P[m.ball.carrier.id];
  const pa = m.passAnim && m.passAnim.tick === m.tickN ? Object.assign({}, m.passAnim) : null;
  const left = m.left;
  snaps.push({P, ball:b, passAnim:pa, tickN:m.tickN, phase:'replay', marks:null, left, dir:t => t === left ? 1 : -1});

function loop(ts){
  const dt = Math.min(120, ts - (last || ts)); last = ts; frameDt = dt || 16;
  if(replay && running){
    replay.t += dt * Math.min(speed, 2);
    while(replay && replay.t >= REPLAY_MS){ replay.t -= REPLAY_MS; if(++replay.i >= replay.frames.length){ replay = null; $('stage').classList.remove('replay'); } }
  } else if(match && running && !match.over){
    acc += dt * speed;
    let n = 0;
    while(acc >= curDur && n++ < 40){
      acc -= curDur;
      const tr = match.tries[0] + match.tries[1];
      match.step(); snap();
      curDur = TICK_MS * (match.dur || 1);
      if(match.tries[0] + match.tries[1] > tr && speed <= 2){ startReplay(); acc = 0; break; }
      if(match.over) break;
    }
    if(match.over && !replay && !ended) onMatchEnd();
  }
  if(match && match.over && !replay && !ended) onMatchEnd();
  drainSfx(); crowdTick(dt);
  if(replay) render(clamp(replay.t / REPLAY_MS, 0, 1), replay.frames[replay.i]);
  else render(running ? clamp(acc / curDur, 0, 1) : 1);
  if(!loop.t || ts - loop.t > 120){ loop.t = ts; if(!replay){ pumpLog(); updateHUD(); } if(curTab === 'stats' && match) renderStats(); if(curTab === 'teams' && match && running) renderTeams(); }
  requestAnimationFrame(loop);
}

function renderLeague(){
  const S = DB.season, tb = standings(), sel = leagueSel || DB.my;
  let h = `<div class="sec">Top 14 — saison ${S.n} · ${S.j >= S.fixtures.length ? 'saison régulière terminée' : `prochaine : journée ${S.j + 1}/26`}</div>`;
  h += `<table class="lg"><tr><th>#</th><th style="text-align:left">Club</th><th>Pts</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th><th>B</th></tr>`;
  tb.forEach((r, i) => {
    const c = CLUB[r.id];
    h += `<tr class="${i < 2 ? 'q1' : i < 6 ? 'q2' : i === 13 ? 'rel' : ''}${r.id === DB.my ? ' me' : ''}${r.id === sel ? ' sel' : ''}" data-id="${r.id}" tabindex="0" title="Voir les statistiques"><td>${i + 1}</td><td class="cl"><span class="dot" style="background:${c.c1}"></span>${c.court}</td><td><b>${r.pts}</b></td><td>${r.J}</td><td>${r.G}</td><td>${r.N}</td><td>${r.P}</td><td>${r.pf - r.pa > 0 ? '+' : ''}${r.pf - r.pa}</td><td>${r.bo + r.bd}</td></tr>`;
  });
  h += `</table><div class="legend"><span style="color:#3ddc97">▌</span>Demi-finales <span style="color:#4ea1ff">▌</span>Barrages <span style="color:#ff5d5d">▌</span>Relégation · touchez un club pour ses statistiques</div>`;
  h += `<div class="btnrow small" style="align-items:center">Mon club <select id="selMy" aria-label="Mon club"><option value="">— aucun —</option>${CLUBS.map(c => `<option value="${c.id}"${c.id === DB.my ? ' selected' : ''}>${c.nom}</option>`).join('')}</select>
    Stats de <select id="selStat" aria-label="Statistiques de l'équipe"><option value="">—</option>${CLUBS.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${c.nom}</option>`).join('')}</select></div>`;
  if(sel) h += seasonCard(sel, tb) + teamCard(sel);
  if(S.j < S.fixtures.length){
    const fx = S.fixtures[S.j].map(([hh, aa], k) => ({hh, aa, k, done:!!S.played[`${S.j}-${k}`]}));
    const mine = f => f.hh === DB.my || f.aa === DB.my, next = fx.find(f => !f.done && mine(f)) || fx.find(f => !f.done);
    h += `<div class="sec">Journée ${S.j + 1}</div><div class="small">` + fx.map(f => `${f.done ? '✔' : '•'} ${mine(f) ? '<b>' : ''}${CLUB[f.hh].court} – ${CLUB[f.aa].court}${mine(f) ? '</b>' : ''}`).join('<br>') + `</div>`;
    h += `<div class="btnrow">${next ? `<button class="btn primary" id="btnWatch">Regarder ${CLUB[next.hh].court} – ${CLUB[next.aa].court}</button>` : ''}
      <button class="btn" id="btnJ">Simuler la journée</button><button class="btn" id="btnSeason">Simuler le reste de la saison</button></div>
      <div class="prog"><i id="simProg"></i></div>`;
  } else {
    if(!S.champion) runPlayoffs();
    h += `<div class="sec">Phases finales</div><div class="small">` + S.playoffs.map(p => `<div style="margin:3px 0">${p.lbl} : ${p.w === p.h ? '<b>' : ''}${CLUB[p.h].court}${p.w === p.h ? '</b>' : ''} ${p.sh} – ${p.sa} ${p.w === p.a ? '<b>' : ''}${CLUB[p.a].court}${p.w === p.a ? '</b>' : ''}</div>`).join('') + `</div>`;
    h += `<div class="card" style="margin-top:8px"><div class="res">🏆 ${CLUB[S.champion].nom} champion de France (saison ${S.n})</div></div>`;
    h += `<div class="btnrow"><button class="btn primary" id="btnNewSeason">Nouvelle saison</button></div>`;
  }
  if(DB.champions.length) h += `<div class="sec">Palmarès</div><div class="small mut">${DB.champions.map(c => `Saison ${c.s} : ${CLUB[c.id].court}`).join(' · ')}</div>`;
  if(DB.history.length) h += `<div class="sec">Derniers résultats</div><div class="small">${DB.history.slice(0, 10).map(r => `<div><span class="mut">${r.kind}</span> ${CLUB[r.h].court} ${r.sh} – ${r.sa} ${CLUB[r.a].court}</div>`).join('')}</div>`;
  h += `<div class="sec">Mémoire</div><div class="small mut">${DB.matches} matchs joués depuis la création. L'expérience est gardée dans ce navigateur.</div>
    <div class="btnrow"><button class="btn" id="btnReset">Tout réinitialiser</button><span id="resetConfirm"></span></div>`;
  $('tab-league').innerHTML = h;
  const bind = (id, f) => { const e = $(id); if(e) e.onclick = f; };
  bind('btnJ', () => simMany(1));
  bind('btnSeason', () => simMany(26));
  bind('btnNewSeason', () => { startNewSeason(); saveDB(); renderLeague(); });
  const pick = id => { leagueSel = id || null; renderLeague(); };
  $('tab-league').querySelectorAll('tr[data-id]').forEach(tr => { tr.onclick = () => pick(tr.dataset.id); tr.onkeydown = e => { if(e.key === 'Enter') pick(tr.dataset.id); }; });
  $('selStat').onchange = e => pick(e.target.value);
  $('selMy').onchange = e => { DB.my = e.target.value || null; leagueSel = null; saveDB(); renderLeague(); };
  bind('btnWatch', () => {
    const free = i => !S.played[`${S.j}-${i}`], F = S.fixtures[S.j];
    let k = F.findIndex(([hh, aa], i) => free(i) && (hh === DB.my || aa === DB.my)); if(k < 0) k = F.findIndex((_, i) => free(i)); if(k < 0) return;
    const [hh, aa] = F[k];
    $('selH').value = hh; $('selA').value = aa;
    newMatch(hh, aa, {h:hh, a:aa, j:S.j, key:`${S.j}-${k}`});
    startMatch(); window.scrollTo({top:0, behavior:'smooth'});
  });
  bind('btnReset', () => {
    $('resetConfirm').innerHTML = `<button class="btn" id="btnReset2" style="border-color:#ff5d5d;color:#ff5d5d">Confirmer l'effacement</button>`;
    $('btnReset2').onclick = () => { DB = newDB(); saveDB(); newMatch($('selH').value, $('selA').value); renderLeague(); };
  });
}

// ----- Démarrage -----
fillSelects();
resize();
cam.zoom = window.innerWidth < 700 ? 4.2 : window.innerWidth < 1100 ? 3.2 : 2.4;
setCam(window.innerWidth < 1100 ? 'follow' : 'wide');
newMatch($('selH').value, $('selA').value);
requestAnimationFrame(loop);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(match) buildField(match.ids[0]); });
window.__sim = {Match, simulate, applyResult, get DB(){ return DB; }, standings, simJournee, runPlayoffs, get match(){ return match; }};
</script>
</body>
</html>
